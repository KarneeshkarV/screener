# Curated common-stock research baskets, not official index constituents.
# Classification vocabulary follows the cited March 2023 GICS methodology.
version: 1
market: us
benchmark: ^GSPC
benchmark_name: S&P 500 price index
observed_on: 2026-10-20
source: https://www.msci.com/documents/1296102/11185224/GICS+Methodology+2023.pdf
membership_basis: curated_research
membership_note: >-
  Current curated research baskets, not official GICS or S&P 500 constituent lists.
  Historical charts use current selected members and have survivorship bias.
  Baskets overlap and are not exhaustive; diversified issuers are not pure-play exposures.
  US means US-listed common or ordinary shares, including foreign-domiciled issuers and equity REITs; no ETFs.
  Adjusted stock returns include distributions; the S&P 500 price index (^GSPC) excludes distributions.
  Equal-weight baskets differ from the benchmark's capitalization weights, size mix and membership.
  Listing symbols and ETF flags were checked against Nasdaq Trader directories on the observation date, not against historical membership.
