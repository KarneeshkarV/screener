[project]
name = "screener"
version = "0.1.0"
description = "A Python CLI for screening, ranking, and backtesting US and Indian equities."
readme = "README.md"
requires-python = ">=3.11"
# The screen path and nothing else. A codebase embedding `screener.api` to run
# one screen should not have to install plotly, a price provider and a bhavcopy
# client to do it, so every other workflow's third-party dependency sits in an
# extra below. Verified by `tests/test_optional_extras.py`, which fails if a
# module declared optional turns out to load on the screen path.
dependencies = [
    "tradingview-screener>=3.0",
    "click>=8.0",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=15.0",
    "requests>=2.31",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "pydantic>=2.13.4",
]

# Keep each extra's members in sync with `screener/_optional.EXTRA_FOR_MODULE`;
# the same test pins that the two agree, so a dependency can never be moved
# here without its import site learning to name the extra.
[project.optional-dependencies]
# HTML reports and tear-sheets: `screen` without --csv, dashboard, tearsheet.
report = ["plotly>=5.24"]
# Price and fundamental history: every backtest, GARP, conviction, options.
prices = [
    "yfinance>=0.2.40",
    "openscreener @ git+https://github.com/KarneeshkarV/openscreener.git",
]
# NSE bhavcopy and corporate announcements: unusual-volume, operator-scan.
india = ["jugaad-data>=0.33.1"]
# Turso mirror for screen-run history and feature-usage tracking.
usage = ["libsql-client>=0.3.1"]
all = [
    "screener[report]",
    "screener[prices]",
    "screener[india]",
    "screener[usage]",
]

[project.scripts]
screener = "screener.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# openscreener is pinned to the rustwright-powered fork via a direct git ref.
allow-direct-references = true

[tool.uv.sources]
openscreener = { git = "https://github.com/KarneeshkarV/openscreener.git" }

[dependency-groups]
dev = [
    "empyrical-reloaded>=0.5.12",
    "matplotlib>=3.10.8",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pandas-ta-classic>=0.6.20",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    # empyrical imports pytz without declaring it, so a clean
    # `uv sync --all-groups` collects tests/correctness/test_metrics_vs_empyrical.py
    # with ModuleNotFoundError until we pin it here ourselves.
    "pytz>=2024.1",
    "ruff>=0.5",
    "types-requests>=2.31",
]

[tool.pytest.ini_options]
markers = [
    "network: requires live internet access (opt in with SCREENER_LIVE_TESTS=1)",
    "requires_talib: requires the optional TA-Lib C library + python wrapper",
    "requires_quantstats: requires the optional quantstats package",
]

[tool.coverage.run]
source = ["screener"]
branch = false
# The vbt-sweep integration talks to vectorbt, an OPTIONAL extra that CI does
# not install (`uv sync --all-groups` installs dependency-groups, not extras).
# Its core paths cannot execute without that dependency, so the only way they
# were ever "covered" was the fake-vectorbt tests removed in this PR. Exercising
# them behaviorally is impossible in CI, so exclude the vectorbt-only modules
# from the denominator rather than fake the dependency. (The whole vbt-sweep
# surface is slated for removal in a later simplification PR.)
omit = [
    "screener/backtester/vbt/indicators.py",
    "screener/backtester/vbt/sweep.py",
    "screener/backtester/vbt/cli.py",
    "screener/backtester/vbt/render.py",
    "screener/backtester/vbt/panels.py",
    "screener/backtester/vbt_sweep.py",
]

[tool.coverage.report]
show_missing = true
# Coverage is a floor, not a target. We test behavior — hand-computed trades,
# look-ahead safety, corporate actions, provider contracts, cross-engine
# reconciliation, CLI smoke — not lines. The previous 99.5% gate incentivized
# ~19.6k LOC of coverage-chasing tests that only forced exception handlers,
# output-formatting branches, compatibility re-exports, and faked optional
# dependencies; those have been removed. 90% keeps genuinely untested new code
# visible without demanding tests that assert nothing about behavior. Do not
# add tests solely to lift this number: if a line is hard to reach behaviorally,
# prefer deleting the dead code or marking it `# pragma: no cover`.
fail_under = 90
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
    "pass  # pragma: no cover",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["screener"]
exclude = ["tests"]
disable_error_code = [
    "index",
    "no-untyped-def",
    "operator",
    "type-arg",
]

[[tool.mypy.overrides]]
module = [
    "jugaad_data.*",
    "openscreener.*",
    "plotly.*",
    "pyarrow",
    "pyarrow.*",
    "tradingview_screener.*",
    "yfinance.*",
]
ignore_missing_imports = true

# tradingview_screener ships py.typed but does not re-export Query/col from its
# package __init__, so attr-defined flags every `from tradingview_screener import
# col, Query`. The names are part of the documented public API; allow the
# implicit re-export rather than ignoring each import site.
[[tool.mypy.overrides]]
module = ["tradingview_screener"]
implicit_reexport = true
